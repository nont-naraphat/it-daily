<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT Daily</title>
<style>
  :root{
    --bg:#0c0f17; --surface:#151b27; --surface2:#1b2331; --raise:#232d3e; --line:#26303f; --line2:#33404f;
    --text:#eef2f8; --muted:#94a1b6; --faint:#5f6c80;
    --accent:#6c5cf0; --accent2:#8b7cff; --accent-soft:rgba(108,92,240,.16);
    --overdue:#ff5a5f; --today:#ff9f43; --soon:#4dabf7; --inprogress:#a78bfa; --backlog:#7c8698; --done:#20c997;
    --urgent:#ff5a5f; --important:#ff9f43; --medium:#4dabf7; --low:#7c8698;
    --c1:#6c5cf0; --c2:#20c997; --c3:#ff9f43; --c4:#4dabf7; --c5:#f368a3; --c6:#51cf66;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;
    --r:12px; --r-sm:8px;
    --ease:cubic-bezier(.22,.61,.36,1); --ease2:cubic-bezier(.34,1.4,.64,1);
    --shadow:0 10px 30px -12px rgba(0,0,0,.6), 0 3px 8px -3px rgba(0,0,0,.4);
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f6fb; --surface:#ffffff; --surface2:#f7f9fd; --raise:#eef1f8; --line:#e6eaf2; --line2:#d7dde9;
      --text:#0f1626; --muted:#59647a; --faint:#93a0b6; --accent-soft:rgba(108,92,240,.1);
      --shadow:0 12px 30px -14px rgba(40,50,90,.24), 0 3px 8px -3px rgba(40,50,90,.12); }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;
    -webkit-font-smoothing:antialiased;padding:0 24px 80px;overflow-x:hidden}
  .wrap{max-width:1280px;margin:0 auto}
  ::selection{background:var(--accent-soft)}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:3px solid var(--bg)}

  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .fade-up{animation:fadeUp .5s var(--ease) both}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}

  header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:16px 0;flex-wrap:wrap;
    background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid transparent;transition:border-color .3s}
  header.stuck{border-color:var(--line)}
  .brand{font-family:var(--mono);font-weight:600;letter-spacing:.22em;font-size:14px}
  .brand b{color:var(--accent)}
  .tabs{display:flex;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
  .tab{font-size:13px;padding:6px 16px;border-radius:7px;color:var(--muted);cursor:pointer;transition:.2s var(--ease);user-select:none}
  .tab:hover{color:var(--text)}
  .tab.active{background:var(--accent);color:#fff;box-shadow:0 2px 8px -2px var(--accent)}
  .spacer{flex:1}
  .status{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 13px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
  .dot.on{background:var(--done);box-shadow:0 0 0 3px color-mix(in srgb,var(--done) 22%,transparent);animation:pulse 2.4s infinite}
  .dot.off{background:var(--overdue);box-shadow:0 0 0 3px color-mix(in srgb,var(--overdue) 22%,transparent)}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 3px color-mix(in srgb,var(--done) 22%,transparent)}50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--done) 8%,transparent)}}
  .hello{font-size:13px;color:var(--muted);display:none}
  .hello{align-items:center;gap:9px}
  .me-av{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid var(--surface);box-shadow:0 0 0 2px var(--accent);flex:none}
  .hello b{color:var(--text);font-weight:500}
  @media (max-width:820px){.hello{display:none!important}}
  .status.auto{color:var(--done);border-color:color-mix(in srgb,var(--done) 40%,var(--line))}
  .status.auto .dot{background:var(--done)}
  button{font-family:var(--sans);font-size:13px;color:var(--text);background:var(--surface2);border:1px solid var(--line2);border-radius:var(--r-sm);padding:9px 15px;cursor:pointer;transition:.18s var(--ease)}
  button:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
  button:active{transform:translateY(0) scale(.98)}
  button:disabled{opacity:.5;cursor:default;transform:none}
  .btn-accent{background:linear-gradient(180deg,var(--accent2),var(--accent));border-color:transparent;color:#fff;font-weight:500;box-shadow:0 3px 12px -3px var(--accent)}
  .btn-accent:hover{color:#fff;filter:brightness(1.06)}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--muted);padding:7px 11px}
  .btn-ghost:hover{background:var(--raise);border-color:transparent}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
  input,select,textarea{font-family:var(--sans);font-size:13px;color:var(--text);background:var(--bg);border:1px solid var(--line2);border-radius:var(--r-sm);padding:9px 11px;transition:.15s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  select option{background:var(--surface);color:var(--text)}
  .plansel select{color:var(--text)}
  textarea{resize:vertical;line-height:1.5}

  .quick{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0 2px}
  .qtile{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 16px;cursor:pointer;transition:.18s var(--ease);min-width:210px;position:relative;overflow:hidden;animation:fadeUp .4s var(--ease) both}
  .qtile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--qc)}
  .qtile:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--line2)}
  .qtile .qi{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex:none;background:var(--qc)}
  .qtile .qt{font-size:14px;font-weight:500;letter-spacing:-.01em}
  .qtile .qs{font-size:11.5px;color:var(--muted)}
  .qtile .qplus{margin-left:auto;font-size:22px;color:var(--qc);font-weight:300}
  .qtile.ro{opacity:.5;cursor:default}.qtile.ro:hover{transform:none;box-shadow:none}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0 22px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden;transition:.2s var(--ease)}
  .kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line2)}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
  .kpi .n{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1}
  .kpi .l{font-size:12px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:6px}
  .kpi .l::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
  @media (max-width:720px){.kpis{grid-template-columns:repeat(3,1fr)}}

  .brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;margin-bottom:8px;position:relative;overflow:hidden}
  .brief::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--accent2),var(--accent))}
  .brief .stamp{font-family:var(--mono);font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.16em}
  .brief h1{font-size:20px;font-weight:600;margin:10px 0 6px;line-height:1.4;letter-spacing:-.01em}
  .brief p{margin:0;color:var(--muted);font-size:14px}
  .brief .hint{color:var(--faint);font-size:13px}
  .risks{margin-top:15px;display:flex;flex-wrap:wrap;gap:8px}
  .risk{font-size:12px;color:var(--overdue);background:color-mix(in srgb,var(--overdue) 12%,transparent);border:1px solid color-mix(in srgb,var(--overdue) 30%,transparent);border-radius:7px;padding:4px 11px}

  .section-row{display:flex;align-items:center;gap:12px;margin:28px 0 16px;flex-wrap:wrap}
  .section-label{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}

  .focus{display:grid;gap:10px}
  .focus-item{display:flex;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 18px;transition:.2s var(--ease)}
  .focus-item:hover{transform:translateX(3px);border-color:var(--line2)}
  .focus-num{font-family:var(--mono);font-size:14px;color:#fff;background:linear-gradient(180deg,var(--accent2),var(--accent));min-width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
  .focus-body .t{font-weight:500;font-size:14.5px}
  .focus-body .w{font-size:13px;color:var(--muted)}
  .tag{font-family:var(--sans);font-size:10.5px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 8px;margin-left:8px}

  .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(256px,1fr));gap:16px;align-items:start}
  .col{transition:.15s}
  .col-bar{height:3px;border-radius:3px 3px 0 0;background:var(--cc)}
  .col-head{display:flex;align-items:center;gap:9px;padding:11px 3px 13px}
  .col-head .cdot{width:9px;height:9px;border-radius:3px;flex:none;background:var(--cc)}
  .col-head .name{font-size:13px;font-weight:600}
  .col-head .count{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto;background:var(--raise);border-radius:999px;padding:2px 9px;min-width:24px;text-align:center}
  .stack{display:grid;gap:10px}
  .addbtn{width:100%;font-size:12px;padding:9px;color:var(--muted);border-style:dashed;background:transparent}
  .addbtn:hover{color:var(--accent);background:var(--accent-soft);border-color:var(--accent)}

  .card{border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;background:var(--surface);position:relative;cursor:pointer;transition:transform .18s var(--ease),box-shadow .18s var(--ease),border-color .18s;overflow:hidden;animation:fadeUp .4s var(--ease) both}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--line2)}
  .card-top{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .card .ct{font-size:13.5px;font-weight:500;line-height:1.42}
  .card .cm{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
  .pill{font-size:10.5px;border-radius:6px;padding:2px 8px;display:inline-flex;align-items:center;gap:4px;font-family:var(--sans)}
  .pill.due{background:var(--raise);color:var(--muted)}
  .pill.due.over{background:color-mix(in srgb,var(--overdue) 15%,transparent);color:var(--overdue)}
  .pill.pct{background:var(--accent-soft);color:var(--accent)}
  .prio{font-size:10.5px;display:inline-flex;align-items:center;gap:3px;margin-left:auto}
  .avatar{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;margin-left:auto}
  .prog{height:5px;border-radius:4px;background:var(--raise);margin-top:10px;overflow:hidden}
  .prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:4px;transition:width .7s var(--ease)}
  .cact{display:flex;align-items:center;gap:7px;margin-top:11px}
  .cact select{padding:5px 8px;font-size:11px;border-radius:7px}
  .cact button{padding:5px 11px;font-size:11px;border-radius:7px}
  .card.done{opacity:.6}.card.done::before{background:var(--done)}
  .card.done .ct{text-decoration:line-through;text-decoration-color:var(--faint)}
  .card.done .ct::before{content:"\2713  ";color:var(--done);font-weight:600;text-decoration:none}
  .card[draggable="true"]{cursor:grab}.card[draggable="true"]:active{cursor:grabbing}
  .card.dragging{opacity:.4;transform:scale(.97) rotate(1.5deg)}
  .more{font-size:11.5px;color:var(--accent);text-align:center;padding:9px 0 2px;cursor:pointer;transition:.15s}
  .more:hover{opacity:.7}
  .empty{font-size:12px;color:var(--faint);padding:16px 2px;text-align:center;border:1px dashed var(--line);border-radius:var(--r)}

  .dropcol{border-radius:var(--r);transition:.15s var(--ease);padding:3px}
  .dropcol.over{background:var(--accent-soft);outline:2px dashed var(--accent);outline-offset:-2px}

  .plansel{display:inline-flex;align-items:center;gap:10px}
  .plansel .picon{width:30px;height:30px;border-radius:9px;background:linear-gradient(180deg,var(--accent2),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
  .plansel select{font-size:14px;font-weight:500;border:none;background:transparent;padding:6px 8px}
  .badge{font-size:11.5px;border-radius:999px;padding:4px 11px;display:inline-flex;align-items:center;gap:5px}
  .badge.edit{color:var(--done);background:color-mix(in srgb,var(--done) 13%,transparent)}
  .badge.ro{color:var(--muted);background:var(--raise)}

  .scrim{position:fixed;inset:0;background:rgba(4,7,12,.55);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:.25s var(--ease);z-index:40}
  .scrim.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:94vw;background:var(--surface);border-left:1px solid var(--line2);
    transform:translateX(102%);transition:transform .32s var(--ease);z-index:50;overflow-y:auto;padding:22px 24px;box-shadow:-16px 0 40px -20px rgba(0,0,0,.5)}
  .drawer.show{transform:none}
  .dw-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:18px}
  .dw-head textarea{flex:1;font-size:17px;font-weight:600;border:none;background:transparent;padding:4px 0;min-height:34px;resize:none;letter-spacing:-.01em}
  .dw-head textarea:focus{box-shadow:none}
  .dw-close{font-size:22px;color:var(--muted);cursor:pointer;background:none;border:none;padding:2px 6px;line-height:1;transition:.15s}
  .dw-close:hover{color:var(--text);transform:rotate(90deg)}
  .dw-label{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.12em;margin:18px 0 8px}
  .dw-notes{width:100%;min-height:130px;font-size:13.5px;line-height:1.6;padding:12px 13px}
  .cl-item{display:flex;align-items:center;gap:10px;padding:6px 0;animation:fadeIn .2s}
  .cl-item .chk{font-size:19px;cursor:pointer;flex:none;line-height:1;background:none;border:none;padding:0;color:var(--muted);transition:.15s}
  .cl-item .chk:hover{transform:scale(1.15)}
  .cl-item .chk.on{color:var(--done)}
  .cl-item input{flex:1;border:none;background:transparent;padding:5px 0;font-size:13px}
  .cl-item input:focus{box-shadow:none}
  .cl-item .del{color:var(--faint);cursor:pointer;background:none;border:none;font-size:16px;padding:0 4px}
  .cl-item.checked input{text-decoration:line-through;color:var(--muted)}
  .cl-add{display:flex;align-items:center;gap:10px;padding:6px 0;color:var(--accent);cursor:pointer;font-size:13px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  .grid2 label{font-size:11px;color:var(--faint);display:block;margin-bottom:6px}
  .grid2 select,.grid2 input{width:100%}
  .dw-actions{display:flex;gap:10px;margin-top:24px;position:sticky;bottom:-22px;background:var(--surface);padding:14px 0}
  .dw-actions .btn-accent{flex:1}
  .dw-err{color:var(--overdue);font-size:12.5px;margin-top:10px;min-height:0}
  .ro-note{font-size:12px;color:var(--muted);background:var(--raise);border-radius:var(--r-sm);padding:11px 13px;margin-top:16px}

  .gate{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:44px 30px;margin:44px auto;max-width:520px;text-align:center;box-shadow:var(--shadow);animation:pop .4s var(--ease2) both}
  .gate .glyph{width:52px;height:52px;border-radius:14px;background:linear-gradient(180deg,var(--accent2),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-family:var(--mono);font-size:22px;font-weight:600;box-shadow:0 8px 22px -8px var(--accent)}
  .gate h2{font-size:19px;margin:0 0 8px}.gate p{color:var(--muted);font-size:14px;margin:0 auto 22px;max-width:400px}
  .code{font-family:var(--mono);font-size:30px;letter-spacing:.32em;background:var(--raise);border:1px dashed var(--accent);border-radius:14px;padding:18px 26px;display:inline-block;margin:8px 0 6px;animation:pop .3s var(--ease2)}
  a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
  .load{color:var(--muted);text-align:center;padding:56px 0;font-size:14px;animation:fadeIn .3s}
</style>
</head>
<body>
<div class="wrap">
  <header id="hdr">
    <span class="brand">IT<b>·</b>DAILY</span>
    <div class="tabs">
      <span class="tab active" id="tab-daily" onclick="switchTab('daily')">วันนี้</span>
      <span class="tab" id="tab-board" onclick="switchTab('board')">บอร์ด</span>
    </div>
    <span class="spacer"></span>
    <span class="hello" id="hello"></span>
    <span class="status" id="autobtn" onclick="toggleAuto()" title="อัปเดตอัตโนมัติทุก 30 วินาที" style="cursor:pointer"><span class="dot" id="dot"></span><span id="statustxt">กำลังเชื่อมต่อ…</span></span>
    <button class="btn-accent" id="sync" onclick="sync()">Sync now</button>
  </header>
  <div id="root"><div class="load">กำลังโหลด…</div></div>
</div>

<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"></div>

<script>
const $=(s)=>document.querySelector(s);
const ORDER=["overdue","today","backlog","soon","inprogress","done"];
const META={
  overdue:{name:"เลยกำหนด",c:"var(--overdue)"}, today:{name:"วันนี้",c:"var(--today)"},
  soon:{name:"ใกล้ถึง",c:"var(--soon)"}, inprogress:{name:"กำลังทำ",c:"var(--inprogress)"},
  backlog:{name:"รอเริ่ม",c:"var(--backlog)"}, done:{name:"เสร็จแล้ว",c:"var(--done)"},
};
const PRIO={urgent:"Urgent",important:"High",medium:"Normal",low:"Low"};
const COLS=["--c1","--c2","--c3","--c4","--c5","--c6"];
const DONE_LIMIT=8;
const esc=(s)=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today0=new Date(new Date().toDateString());
let TAB="daily", PLANS=[], BOARD=null, EDIT=null, DONE_EXPANDED=false, DRAG=null, DAILY=null, AUTO=true, AUTO_IV=null, QUICK=[], QUICK_LOADED=false;

function renderQuick(){
  if(!QUICK.length) return "";
  let h='<div class="quick">';
  QUICK.forEach((q,i)=>{
    const col=`var(${COLS[i%COLS.length]})`;
    const click=q.editable?`onclick="quickCreate('${q.plan_id}','${q.bucket_id||""}')"`:"";
    h+=`<div class="qtile ${q.editable?"":"ro"}" style="--qc:${col};animation-delay:${i*40}ms" ${click}>
      <span class="qi">＋</span>
      <div><div class="qt">${esc(q.label)}</div><div class="qs">${esc(q.plan)}${q.bucket?` · ${esc(q.bucket)}`:""}</div></div>
      ${q.editable?'<span class="qplus">›</span>':'<span class="qs">read-only</span>'}</div>`;
  });
  return h+'</div>';
}
async function quickCreate(pid,bid){
  const b=await (await fetch("/api/board?plan_id="+encodeURIComponent(pid))).json();
  if(b.error){ alert(b.error); return; }
  BOARD=b; newTask(bid);
}

function greet(){ const hr=new Date().getHours(); return hr<12?"สวัสดีตอนเช้า":hr<17?"สวัสดีตอนบ่าย":"สวัสดีตอนเย็น"; }
function toggleAuto(){ AUTO=!AUTO; startAuto(); $("#autobtn").classList.toggle("auto",AUTO);
  $("#statustxt").textContent=AUTO?"อัปเดตอัตโนมัติ":"เชื่อมแล้ว"; }
function startAuto(){ if(AUTO_IV) clearInterval(AUTO_IV); if(!AUTO) return;
  AUTO_IV=setInterval(()=>{ if(EDIT) return; autoRefresh(); },30000); }
async function autoRefresh(){
  try{
    if(TAB==="daily"){ const d=await (await fetch("/api/data")).json(); if(d.connected){ DAILY=d; renderDaily(d); } }
    else if(BOARD){ const b=await (await fetch("/api/board?plan_id="+encodeURIComponent(BOARD.plan_id))).json(); if(!b.error){ BOARD=b; renderBoard(); } }
  }catch(e){}
}

addEventListener("scroll",()=>{ $("#hdr").classList.toggle("stuck",scrollY>8); });

async function boot(){
  const st=await (await fetch("/api/status")).json();
  if(!st.config_ok){ $("#dot").className="dot off"; $("#statustxt").textContent="ยังไม่ได้ตั้งค่า .env"; $("#root").innerHTML=""; return; }
  if(!st.connected){ $("#dot").className="dot off"; $("#statustxt").textContent="ยังไม่ได้เชื่อม"; renderGate(); return; }
  $("#dot").className="dot on"; $("#statustxt").textContent=AUTO?"อัปเดตอัตโนมัติ":"เชื่อมแล้ว"; $("#autobtn").classList.toggle("auto",AUTO); $("#statustxt").title="AI สรุปอัตโนมัติ "+st.schedule;
  const u=st.user||{};
  if(u.name||u.mail){ const el=$("#hello"); el.style.display="inline-flex"; el.innerHTML=`<img class="me-av" src="/api/photo" alt="" onerror="this.style.display=&#39;none&#39;"><span>${greet()}, <b>${esc(u.name||u.displayName)}</b>${u.mail?` · <span style="color:var(--faint)">${esc(u.mail)}</span>`:""}</span>`; }
  startAuto();
  switchTab(TAB);
}
function switchTab(t){
  TAB=t; $("#tab-daily").classList.toggle("active",t==="daily"); $("#tab-board").classList.toggle("active",t==="board");
  if(t==="daily") loadDaily(); else loadBoard();
}
async function sync(){
  const b=$("#sync"); b.disabled=true; b.innerHTML='<span class="spin"></span> sync…';
  try{ if(TAB==="daily"){ const d=await (await fetch("/api/refresh",{method:"POST"})).json(); if(d.connected) renderDaily(d); else renderGate(); }
       else await loadBoard(); }
  finally{ b.disabled=false; b.textContent="Sync now"; }
}

function animate(){
  requestAnimationFrame(()=>{
    document.querySelectorAll('.prog>i[data-w]').forEach(el=>el.style.width=el.dataset.w+'%');
    document.querySelectorAll('.kpi .n[data-n]').forEach(el=>{
      const t=+el.dataset.n; if(!t){el.textContent="0";return;} let s=null;
      const step=(ts)=>{ if(!s)s=ts; const p=Math.min((ts-s)/550,1); el.textContent=Math.round((1-Math.pow(1-p,3))*t); if(p<1)requestAnimationFrame(step); };
      requestAnimationFrame(step);
    });
  });
}
function stagger(sel){ document.querySelectorAll(sel).forEach((el,i)=>el.style.animationDelay=(i*35)+"ms"); }

/* ---------- DAILY ---------- */
async function loadDaily(){
  $("#root").innerHTML='<div class="load">กำลังโหลดงาน…</div>';
  if(!QUICK_LOADED){ try{ const q=await (await fetch("/api/quick")).json(); QUICK=Array.isArray(q)?q:[]; }catch(e){} QUICK_LOADED=true; }
  const d=await (await fetch("/api/data")).json();
  if(!d.connected){ renderGate(); return; } DAILY=d; renderDaily(d);
}
function overdue(due){ return due && new Date(due) < today0; }
function dailyCard(t){
  const opts=[0,25,50,75,100].map(v=>`<option value="${v}" ${v===t.percent?"selected":""}>${v}%</option>`).join("");
  if(t.status==="done") return `<div class="card done" style="--c:var(--done)" onclick="openTask('${t.id}')"><div class="ct">${esc(t.title)}</div>
    <div class="cm">${t.plan?`<span class="tag">${esc(t.plan)}</span>`:""}${t.completed?`<span class="pill due">เสร็จ ${esc(t.completed)}</span>`:""}</div></div>`;
  const duePill=t.due?`<span class="pill due ${overdue(t.due)?"over":""}">${esc(t.due)}</span>`:"";
  return `<div class="card" style="--c:${META[t.status].c}" onclick="openTask('${t.id}')">
    ${t.plan?`<div class="card-top"><span class="tag" style="margin:0">${esc(t.plan)}</span><span class="prio" style="color:var(--${t.prio||'medium'})">${PRIO[t.prio||'medium']}</span></div>`:""}
    <div class="ct">${esc(t.title)}</div>
    <div class="cm">${duePill}${t.percent>0?`<span class="pill pct">${t.percent}%</span>`:""}</div>
    ${t.percent>0?`<div class="prog"><i data-w="${t.percent}"></i></div>`:""}
    <div class="cact" onclick="event.stopPropagation()"><select onchange="setPercent('${t.id}',this.value)">${opts}</select>
      <button onclick="setPercent('${t.id}',100)">เสร็จ</button></div></div>`;
}
function renderDaily(d){
  const ai=d.ai, tasks=d.tasks||[]; const gen=d.generated_at?new Date(d.generated_at).toLocaleString("th-TH"):"";
  const by=(k)=>tasks.filter(t=>t.status===k); let h=renderQuick();
  h+=`<div class="kpis fade-up">`;
  for(const k of ["overdue","today","soon","inprogress","done"]) h+=`<div class="kpi" style="--c:${META[k].c}"><div class="n" data-n="${by(k).length}">0</div><div class="l">${META[k].name}</div></div>`;
  h+=`</div>`;
  h+=`<div class="brief fade-up" style="animation-delay:60ms"><div class="stamp">อัปเดตล่าสุด · ${esc(gen)}</div>`;
  if(ai){ h+=`<h1>${esc(ai.headline||"สรุปงานวันนี้")}</h1><p>${esc(ai.summary||"")}</p>`;
    if(ai.risks&&ai.risks.length) h+=`<div class="risks">${ai.risks.map(r=>`<span class="risk">${esc(r)}</span>`).join("")}</div>`; }
  else h+=`<h1>สรุปงานวันนี้</h1><p class="hint">เพิ่ม ANTHROPIC_API_KEY ใน Portainer เพื่อเปิดสรุปอัตโนมัติจาก AI ตอนเช้า</p>`;
  h+=`</div>`;
  if(ai&&ai.today_focus&&ai.today_focus.length){
    h+=`<div class="section-row fade-up"><span class="section-label">โฟกัสวันนี้</span></div><div class="focus">`;
    ai.today_focus.forEach((f,i)=>{ h+=`<div class="focus-item fade-up" style="animation-delay:${i*40}ms"><div class="focus-num">${i+1}</div><div class="focus-body">
      <div class="t">${esc(f.title)}${f.plan?`<span class="tag">${esc(f.plan)}</span>`:""}</div><div class="w">${esc(f.why||"")}</div></div></div>`; });
    h+=`</div>`;
  }
  h+=`<div class="section-row fade-up"><span class="section-label">งานของฉัน</span></div><div class="board">`;
  ORDER.forEach((k,ci)=>{
    let list=by(k); if(k==="done") list=list.slice().sort((a,b)=>(b.completed||"").localeCompare(a.completed||""));
    h+=`<div class="col fade-up" style="animation-delay:${ci*50}ms"><div class="col-bar" style="--cc:${META[k].c}"></div><div class="col-head"><span class="cdot" style="--cc:${META[k].c}"></span><span class="name">${META[k].name}</span><span class="count">${list.length}</span></div>`;
    if(!list.length) h+=`<div class="empty">—</div>`;
    else{ const exp=DONE_EXPANDED&&k==="done"; const show=(k==="done"&&!exp)?list.slice(0,DONE_LIMIT):list;
      h+=`<div class="stack">${show.map(dailyCard).join("")}`;
      if(k==="done"&&list.length>DONE_LIMIT) h+=`<div class="more" onclick="DONE_EXPANDED=!DONE_EXPANDED;renderDaily(DAILY)">${exp?"▲ ย่อ":"+ อีก "+(list.length-DONE_LIMIT)+" งาน"}</div>`;
      h+=`</div>`; }
    h+=`</div>`;
  });
  h+=`</div>`; $("#root").innerHTML=h; animate();
}

/* ---------- BOARD ---------- */
async function loadBoard(){
  $("#root").innerHTML='<div class="load">กำลังโหลด plan…</div>';
  if(!PLANS.length){ const r=await (await fetch("/api/plans")).json(); PLANS=Array.isArray(r)?r:[]; }
  if(!PLANS.length){ $("#root").innerHTML='<div class="empty" style="margin-top:30px">ไม่พบ plan — ลองสร้าง plan ใน Planner ก่อน</div>'; return; }
  const pid=(BOARD&&BOARD.plan_id)||PLANS[0].id;
  const b=await (await fetch("/api/board?plan_id="+encodeURIComponent(pid))).json();
  if(b.error){ $("#root").innerHTML=`<div class="empty" style="margin-top:30px">${esc(b.error)}</div>`; return; }
  BOARD=b; renderBoard();
}
async function changePlan(pid){ const b=await (await fetch("/api/board?plan_id="+encodeURIComponent(pid))).json(); if(!b.error){ BOARD=b; renderBoard(); } }
function boardCard(t){
  const drag=BOARD.editable?`draggable="true" ondragstart="dragStart(event,'${t.id}')" ondragend="dragEnd(event)"`:"";
  const cls=t.status==="done"?"card done":"card";
  const c=t.status==="done"?"var(--done)":META[t.status].c;
  const duePill=t.due?`<span class="pill due ${overdue(t.due)?"over":""}">${esc(t.due)}</span>`:"";
  return `<div class="${cls}" ${drag} style="--c:${c}" onclick="openTask('${t.id}')">
    <div class="card-top"><span class="prio" style="color:var(--${t.prio||'medium'});margin:0">● ${PRIO[t.prio||'medium']}</span></div>
    <div class="ct">${esc(t.title)}</div>
    <div class="cm">${duePill}${t.percent>0&&t.percent<100?`<span class="pill pct">${t.percent}%</span>`:""}</div>
    ${t.percent>0&&t.percent<100?`<div class="prog"><i data-w="${t.percent}"></i></div>`:""}</div>`;
}
function renderBoard(){
  const b=BOARD; let h="";
  h+=`<div class="section-row fade-up"><span class="plansel"><span class="picon">▦</span><select onchange="changePlan(this.value)">`;
  h+=PLANS.map(p=>`<option value="${esc(p.id)}" ${p.id===b.plan_id?"selected":""}>${esc(p.title)}</option>`).join("");
  h+=`</select>${b.editable?`<span class="badge edit">● แก้ไขได้</span>`:`<span class="badge ro">อ่านอย่างเดียว</span>`}</span><span class="spacer"></span>`;
  h+=`<span class="section-label">${b.tasks.length} งาน</span>`;
  if(b.editable) h+=`<button class="btn-accent" onclick="newTask('')">+ งานใหม่</button>`;
  h+=`</div>`;
  const buckets=b.buckets.length?b.buckets:[{id:"",name:"งาน"}];
  h+=`<div class="board">`;
  buckets.forEach((bk,i)=>{
    const cc=`var(${COLS[i%COLS.length]})`;
    const list=b.tasks.filter(t=>(t.bucketId||"")===bk.id);
    const dz=b.editable?`class="col dropcol" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropTask(event,'${bk.id}')"`:`class="col"`;
    h+=`<div ${dz} style="animation-delay:${i*50}ms"><div class="col-bar" style="--cc:${cc}"></div><div class="col-head"><span class="cdot" style="--cc:${cc}"></span><span class="name">${esc(bk.name)}</span><span class="count">${list.length}</span></div>`;
    h+=`<div class="stack">${list.map(boardCard).join("")||'<div class="empty">—</div>'}`;
    if(b.editable) h+=`<button class="addbtn" onclick="newTask('${bk.id}')">+ เพิ่มงาน</button>`;
    h+=`</div></div>`;
  });
  h+=`</div>`; $("#root").innerHTML=h;
  document.querySelectorAll('.board .col').forEach(c=>c.classList.add('fade-up')); animate();
}
function dragStart(e,id){ DRAG=id; e.dataTransfer.effectAllowed="move"; e.currentTarget.classList.add("dragging"); }
function dragEnd(e){ DRAG=null; e.currentTarget.classList.remove("dragging"); document.querySelectorAll(".dropcol").forEach(c=>c.classList.remove("over")); }
function dragOver(e){ e.preventDefault(); e.currentTarget.classList.add("over"); }
function dragLeave(e){ e.currentTarget.classList.remove("over"); }
async function dropTask(e,bucketId){
  e.preventDefault(); e.currentTarget.classList.remove("over"); if(!DRAG) return;
  const id=DRAG; const t=BOARD.tasks.find(x=>x.id===id); if(t&&(t.bucketId||"")===bucketId) return;
  const res=await fetch("/api/task/"+encodeURIComponent(id)+"/move",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({bucket_id:bucketId})});
  const j=await res.json(); if(!res.ok){ alert(j.error||"ย้ายไม่สำเร็จ"); return; } loadBoard();
}

/* ---------- DRAWER ---------- */
function closeDrawer(){ $("#scrim").classList.remove("show"); $("#drawer").classList.remove("show"); EDIT=null; }
function showDrawer(html){ $("#drawer").innerHTML=html; $("#scrim").classList.add("show"); $("#drawer").classList.add("show"); }
async function openTask(id){
  showDrawer('<div class="load">กำลังโหลด…</div>');
  const t=await (await fetch("/api/task/"+encodeURIComponent(id))).json();
  if(t.error){ showDrawer(`<div class="ro-note">${esc(t.error)}</div>`); return; }
  EDIT={id:t.id, checklist:t.checklist.map(c=>({...c})), deleted:[], editable:t.editable, bucketId:t.bucketId};
  drawTask(t); animate();
}
function newTask(bucketId){ if(!BOARD) return;
  EDIT={id:null, checklist:[], deleted:[], editable:(BOARD?BOARD.editable:true), create:true, bucketId:bucketId||""};
  drawTask({title:"",notes:"",due:"",priority:"medium",percent:0,bucketId:bucketId||"",editable:true,checklist:[]});
}
function drawTask(t){
  const ed=EDIT.editable, dis=ed?"":"disabled";
  const bopts=(BOARD?BOARD.buckets:[]).map(bk=>`<option value="${esc(bk.id)}" ${bk.id===(t.bucketId||"")?"selected":""}>${esc(bk.name)}</option>`).join("");
  const popts=Object.keys(PRIO).map(k=>`<option value="${k}" ${k===(t.priority||"medium")?"selected":""}>${PRIO[k]}</option>`).join("");
  const perc=[0,25,50,75,100].map(v=>`<option value="${v}" ${v===(t.percent||0)?"selected":""}>${v}%</option>`).join("");
  let h=`<div class="dw-head"><textarea id="d-title" ${dis} placeholder="ชื่องาน">${esc(t.title)}</textarea><button class="dw-close" onclick="closeDrawer()">&times;</button></div>`;
  h+=`<div class="dw-label">รายละเอียด</div><textarea class="dw-notes" id="d-notes" ${dis} placeholder="โน้ต / คำอธิบาย">${esc(t.notes||"")}</textarea>`;
  h+=`<div class="dw-label">Checklist</div><div id="d-cl"></div>`;
  if(ed) h+=`<div class="cl-add" onclick="clAdd()"><span style="font-size:17px">+</span> เพิ่มรายการ</div>`;
  h+=`<div class="grid2" style="margin-top:18px">
    <div><label>กำหนดส่ง</label><input type="date" id="d-due" ${dis} value="${esc(t.due||"")}"></div>
    <div><label>Priority</label><select id="d-prio" ${dis}>${popts}</select></div>
    <div><label>Bucket</label><select id="d-bucket" ${dis}>${bopts||'<option value="">(default)</option>'}</select></div>
    <div><label>Progress</label><select id="d-perc" ${dis}>${perc}</select></div></div>`;
  if(!ed) h+=`<div class="ro-note">plan นี้เป็น "อ่านอย่างเดียว" — แก้ไขไม่ได้ (ไม่อยู่ใน whitelist)</div>`;
  h+=`<div class="dw-err" id="d-err"></div>`;
  if(ed) h+=`<div class="dw-actions"><button class="btn-accent" id="d-save" onclick="saveTask()">${EDIT.create?"สร้างงาน":"บันทึก"}</button>
    ${EDIT.create?"":`<button onclick="quickDone()">ปิดงาน</button>`}<button class="btn-ghost" onclick="closeDrawer()">ปิด</button></div>`;
  showDrawer(h); renderCL();
}
function renderCL(){
  const box=$("#d-cl"); if(!box) return; const ed=EDIT.editable;
  box.innerHTML=EDIT.checklist.map((c,i)=>`<div class="cl-item ${c.checked?"checked":""}">
    <button class="chk ${c.checked?"on":""}" ${ed?"":"disabled"} onclick="clToggle(${i})">${c.checked?"&#9745;":"&#9744;"}</button>
    <input value="${esc(c.title)}" ${ed?"":"disabled"} oninput="clEdit(${i},this.value)" placeholder="รายการ">
    ${ed?`<button class="del" onclick="clDel(${i})">&times;</button>`:""}</div>`).join("")
    || '<div style="font-size:12.5px;color:var(--faint);padding:4px 0">— ไม่มีรายการ —</div>';
}
function clAdd(){ EDIT.checklist.push({title:"",checked:false}); renderCL(); }
function clToggle(i){ EDIT.checklist[i].checked=!EDIT.checklist[i].checked; renderCL(); }
function clEdit(i,v){ EDIT.checklist[i].title=v; }
function clDel(i){ const c=EDIT.checklist[i]; if(c.id) EDIT.deleted.push(c.id); EDIT.checklist.splice(i,1); renderCL(); }
async function saveTask(){
  const err=$("#d-err"), btn=$("#d-save"); err.textContent="";
  const title=$("#d-title").value.trim(); if(!title){ err.textContent="ใส่ชื่องานก่อน"; return; }
  btn.disabled=true; btn.innerHTML='<span class="spin"></span> บันทึก…';
  const cl=EDIT.checklist.filter(c=>c.title.trim()).map(c=>({id:c.id,title:c.title.trim(),checked:c.checked}));
  const common={title, notes:$("#d-notes").value, due:$("#d-due").value, priority:$("#d-prio").value, percent:Number($("#d-perc").value), bucket_id:$("#d-bucket").value};
  let res;
  if(EDIT.create){
    res=await fetch("/api/tasks",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...common, plan_id:BOARD.plan_id, assign_me:true})});
    const j=await res.json();
    if(res.ok && (cl.length || common.notes)){ await fetch("/api/task/"+encodeURIComponent(j.id),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({notes:common.notes,checklist:cl})}); }
    if(!res.ok){ err.textContent=j.error||"สร้างไม่สำเร็จ"; btn.disabled=false; btn.textContent="สร้างงาน"; return; }
  }else{
    res=await fetch("/api/task/"+encodeURIComponent(EDIT.id),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({...common, checklist:cl, checklist_deleted:EDIT.deleted})});
    const j=await res.json(); if(!res.ok){ err.textContent=j.error||"บันทึกไม่สำเร็จ"; btn.disabled=false; btn.textContent="บันทึก"; return; }
  }
  closeDrawer(); TAB==="board"?loadBoard():loadDaily();
}
async function quickDone(){
  const res=await fetch("/api/task/"+encodeURIComponent(EDIT.id),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({percent:100})});
  const j=await res.json(); if(!res.ok){ $("#d-err").textContent=j.error||"ปิดงานไม่สำเร็จ"; return; }
  closeDrawer(); TAB==="board"?loadBoard():loadDaily();
}
async function setPercent(id,val){
  const res=await fetch("/api/task/"+encodeURIComponent(id),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({percent:Number(val)})});
  const j=await res.json(); if(!res.ok){ alert(j.error||"อัปเดตไม่สำเร็จ"); return; } loadDaily();
}

/* ---------- GATE ---------- */
function renderGate(){
  $("#root").innerHTML=`<div class="gate"><div class="glyph">M</div><h2>เชื่อมต่อ Microsoft Planner</h2>
    <p>กด Connect แล้วเอารหัสไปกรอกที่หน้า Microsoft เพื่อเชื่อมบัญชีครั้งเดียว จากนั้นระบบจะดึงงานและอัปเดตให้เองทุกเช้า</p>
    <button class="btn-accent" onclick="connect()">Connect</button><div id="gateout" style="margin-top:18px"></div></div>`;
}
async function connect(){
  const out=$("#gateout"); out.innerHTML="กำลังขอรหัส…";
  const r=await (await fetch("/auth/start",{method:"POST"})).json();
  if(r.error){ out.innerHTML=`<span style="color:var(--overdue)">${esc(r.error)}</span>`; return; }
  out.innerHTML=`<div class="code">${esc(r.user_code)}</div><div style="color:var(--muted);font-size:13px">กรอกรหัสนี้ที่ <a href="${esc(r.verification_uri)}" target="_blank">${esc(r.verification_uri)}</a></div>`;
  const iv=setInterval(async()=>{ const st=await (await fetch("/api/status")).json();
    if(st.connected){ clearInterval(iv); $("#dot").className="dot on"; $("#statustxt").textContent="เชื่อมแล้ว"; switchTab(TAB); } },4000);
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDrawer(); });
boot();
</script>
