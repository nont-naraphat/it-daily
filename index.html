<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT Daily</title>
<style>
  :root{
    --bg:#0d1017; --surface:#141922; --surface2:#1a202b; --raise:#202836; --line:#242c39; --line2:#2f3947;
    --text:#eaeef4; --muted:#9aa5b4; --faint:#5f6b7c;
    --accent:#5b8dff; --accent-soft:#1e2b47;
    --overdue:#f0524f; --today:#e8973a; --soon:#5b8dff; --inprogress:#8a94a6; --backlog:#5f6b7c; --done:#3fae74;
    --urgent:#f0524f; --important:#e8973a; --medium:#5b8dff; --low:#5f6b7c;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;
    --r:10px; --r-sm:7px;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f5f7fa; --surface:#ffffff; --surface2:#f7f9fc; --raise:#eef2f7; --line:#e4e9f0; --line2:#d5dce6;
      --text:#131824; --muted:#5a6575; --faint:#98a2b2; --accent-soft:#e8effe; }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;
    -webkit-font-smoothing:antialiased;padding:0 22px 72px}
  .wrap{max-width:1240px;margin:0 auto}
  ::selection{background:var(--accent-soft)}

  header{display:flex;align-items:center;gap:14px;padding:18px 0;flex-wrap:wrap}
  .brand{font-family:var(--mono);font-weight:600;letter-spacing:.24em;font-size:14px}
  .brand b{color:var(--accent)}
  .tabs{display:flex;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px}
  .tab{font-size:13px;padding:6px 15px;border-radius:6px;color:var(--muted);cursor:pointer;transition:.15s;user-select:none}
  .tab.active{background:var(--raise);color:var(--text)}
  .spacer{flex:1}
  .status{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);
    background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
  .dot.on{background:var(--done);box-shadow:0 0 0 3px color-mix(in srgb,var(--done) 20%,transparent)}
  .dot.off{background:var(--overdue);box-shadow:0 0 0 3px color-mix(in srgb,var(--overdue) 20%,transparent)}
  button{font-family:var(--sans);font-size:13px;color:var(--text);background:var(--surface2);
    border:1px solid var(--line2);border-radius:var(--r-sm);padding:8px 15px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button:disabled{opacity:.5;cursor:default}
  .btn-accent{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
  .btn-accent:hover{background:color-mix(in srgb,var(--accent) 88%,#000);color:#fff}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 10px}
  input,select,textarea{font-family:var(--sans);font-size:13px;color:var(--text);background:var(--bg);
    border:1px solid var(--line2);border-radius:var(--r-sm);padding:8px 10px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  textarea{resize:vertical;line-height:1.5}

  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:6px 0 20px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
  .kpi .n{font-family:var(--mono);font-size:24px;font-weight:600;line-height:1}
  .kpi .l{font-size:11.5px;color:var(--muted);margin-top:5px}
  @media (max-width:720px){ .kpis{grid-template-columns:repeat(3,1fr)} }

  .brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:8px;position:relative}
  .brief::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:3px;background:var(--accent)}
  .brief .stamp{font-family:var(--mono);font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.15em}
  .brief h1{font-size:19px;font-weight:600;margin:9px 0 6px;line-height:1.4}
  .brief p{margin:0;color:var(--muted);font-size:14px}
  .brief .hint{color:var(--faint);font-size:13px}
  .risks{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
  .risk{font-size:12px;color:var(--overdue);background:color-mix(in srgb,var(--overdue) 11%,transparent);
    border:1px solid color-mix(in srgb,var(--overdue) 28%,transparent);border-radius:6px;padding:3px 10px}

  .section-row{display:flex;align-items:center;gap:12px;margin:26px 0 14px;flex-wrap:wrap}
  .section-label{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .section-row .spacer{flex:1}

  .focus{display:grid;gap:9px}
  .focus-item{display:flex;gap:15px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 17px}
  .focus-num{font-family:var(--mono);font-size:14px;color:var(--accent);min-width:20px;padding-top:1px}
  .focus-body .t{font-weight:500;font-size:14.5px}
  .focus-body .w{font-size:13px;color:var(--muted)}
  .tag{font-family:var(--mono);font-size:10.5px;color:var(--muted);background:var(--raise);border-radius:5px;padding:2px 7px;margin-left:8px}

  .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:14px;align-items:start}
  .col-head{display:flex;align-items:center;gap:8px;padding:0 2px 11px;border-bottom:1px solid var(--line)}
  .col-head .cdot{width:8px;height:8px;border-radius:3px;flex:none}
  .col-head .name{font-size:12.5px;font-weight:600}
  .col-head .count{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto;background:var(--raise);border-radius:999px;padding:1px 8px;min-width:22px;text-align:center}
  .stack{display:grid;gap:9px;margin-top:11px}
  .addbtn{width:100%;font-size:12px;padding:8px;color:var(--muted);border-style:dashed}

  .card{border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;background:var(--surface);border-left:3px solid var(--c);cursor:pointer;transition:.15s}
  .card:hover{border-color:var(--line2)}
  .card .ct{font-size:13.5px;font-weight:500;line-height:1.4}
  .card .cm{display:flex;flex-wrap:wrap;align-items:center;gap:5px 9px;margin-top:8px;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
  .card .cm .due{color:var(--muted)}
  .flag{width:7px;height:7px;border-radius:50%;display:inline-block}
  .prog{height:4px;border-radius:3px;background:var(--raise);margin-top:9px;overflow:hidden}
  .prog>i{display:block;height:100%;background:var(--c);border-radius:3px;transition:width .3s}
  .cact{display:flex;align-items:center;gap:7px;margin-top:10px}
  .cact select{padding:4px 7px;font-size:11px;border-radius:6px}
  .cact button{padding:4px 11px;font-size:11px;border-radius:6px}
  .card.done{opacity:.62;border-left-color:var(--done);cursor:pointer}
  .card.done .ct{text-decoration:line-through;text-decoration-color:var(--faint)}
  .card.done .ct::before{content:"\2713  ";color:var(--done);font-weight:600;text-decoration:none}
  .more{font-size:11.5px;color:var(--faint);text-align:center;padding:8px 0 2px}
  .empty{font-size:12px;color:var(--faint);padding:14px 2px;text-align:center;border:1px dashed var(--line);border-radius:var(--r);margin-top:11px}

  .plansel{display:inline-flex;align-items:center;gap:8px}
  .badge{font-size:11.5px;border-radius:999px;padding:3px 10px;display:inline-flex;align-items:center;gap:5px}
  .badge.edit{color:var(--done);background:color-mix(in srgb,var(--done) 12%,transparent)}
  .badge.ro{color:var(--muted);background:var(--raise)}

  /* Drawer */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.2s;z-index:40}
  .scrim.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:var(--surface);
    border-left:1px solid var(--line2);transform:translateX(100%);transition:transform .22s ease;z-index:50;
    overflow-y:auto;padding:20px 22px}
  .drawer.show{transform:translateX(0)}
  .dw-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px}
  .dw-head textarea{flex:1;font-size:16px;font-weight:500;border:none;background:transparent;padding:4px 0;min-height:32px;resize:none}
  .dw-close{font-size:20px;color:var(--muted);cursor:pointer;background:none;border:none;padding:2px 4px;line-height:1}
  .dw-label{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;margin:16px 0 7px}
  .dw-notes{width:100%;min-height:64px;font-size:13px}
  .cl-item{display:flex;align-items:center;gap:9px;padding:5px 0}
  .cl-item .chk{font-size:18px;cursor:pointer;flex:none;line-height:1;background:none;border:none;padding:0;color:var(--muted)}
  .cl-item .chk.on{color:var(--done)}
  .cl-item input{flex:1;border:none;background:transparent;padding:4px 0;font-size:13px}
  .cl-item .del{color:var(--faint);cursor:pointer;background:none;border:none;font-size:15px;padding:0 4px}
  .cl-item.checked input{text-decoration:line-through;color:var(--muted)}
  .cl-add{display:flex;align-items:center;gap:9px;padding:5px 0;color:var(--muted);cursor:pointer;font-size:13px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid2 label{font-size:11px;color:var(--faint);display:block;margin-bottom:5px}
  .grid2 select,.grid2 input{width:100%}
  .dw-actions{display:flex;gap:9px;margin-top:22px;position:sticky;bottom:0;background:var(--surface);padding-top:12px}
  .dw-actions .btn-accent{flex:1}
  .dw-err{color:var(--overdue);font-size:12.5px;margin-top:10px;min-height:0}
  .ro-note{font-size:12px;color:var(--muted);background:var(--raise);border-radius:var(--r-sm);padding:9px 11px;margin-top:14px}

  .gate{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:40px 28px;margin:40px auto;max-width:520px;text-align:center}
  .gate .glyph{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-family:var(--mono);font-size:20px;font-weight:600}
  .gate h2{font-size:18px;margin:0 0 8px}.gate p{color:var(--muted);font-size:14px;margin:0 auto 20px;max-width:400px}
  .code{font-family:var(--mono);font-size:28px;letter-spacing:.3em;background:var(--raise);border:1px dashed var(--accent);border-radius:12px;padding:16px 22px;display:inline-block;margin:8px 0 6px}
  a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
  .load{color:var(--muted);text-align:center;padding:48px 0;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand">IT<b>·</b>DAILY</span>
    <div class="tabs">
      <span class="tab active" id="tab-daily" onclick="switchTab('daily')">วันนี้</span>
      <span class="tab" id="tab-board" onclick="switchTab('board')">บอร์ด</span>
    </div>
    <span class="spacer"></span>
    <span class="status"><span class="dot" id="dot"></span><span id="statustxt">กำลังเชื่อมต่อ…</span></span>
    <button class="btn-accent" id="sync" onclick="sync()">Sync now</button>
  </header>
  <div id="root"><div class="load">กำลังโหลด…</div></div>
</div>

<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"></div>

<script>
const $=(s)=>document.querySelector(s);
const ORDER=["overdue","today","soon","inprogress","backlog","done"];
const META={
  overdue:{name:"เลยกำหนด",c:"var(--overdue)"}, today:{name:"วันนี้",c:"var(--today)"},
  soon:{name:"ใกล้ถึง",c:"var(--soon)"}, inprogress:{name:"กำลังทำ",c:"var(--inprogress)"},
  backlog:{name:"รอเริ่ม",c:"var(--backlog)"}, done:{name:"เสร็จแล้ว",c:"var(--done)"},
};
const PRIO={urgent:"Urgent",important:"Important",medium:"Medium",low:"Low"};
const DONE_LIMIT=8;
const esc=(s)=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let TAB="daily", PLANS=[], BOARD=null, EDIT=null;

function fmtDate(){ return new Date().toLocaleDateString("th-TH",{weekday:"long",day:"numeric",month:"long",year:"numeric"}); }

async function boot(){
  const st=await (await fetch("/api/status")).json();
  if(!st.config_ok){ $("#dot").className="dot off"; $("#statustxt").textContent="ยังไม่ได้ตั้งค่า .env"; $("#root").innerHTML=""; return; }
  if(!st.connected){ $("#dot").className="dot off"; $("#statustxt").textContent="ยังไม่ได้เชื่อม Microsoft"; renderGate(); return; }
  $("#dot").className="dot on"; $("#statustxt").textContent=st.schedule;
  switchTab(TAB);
}
function switchTab(t){
  TAB=t;
  $("#tab-daily").classList.toggle("active",t==="daily");
  $("#tab-board").classList.toggle("active",t==="board");
  if(t==="daily") loadDaily(); else loadBoard();
}
async function sync(){
  const b=$("#sync"); b.disabled=true; b.textContent="กำลัง sync…";
  try{ if(TAB==="daily"){ const d=await (await fetch("/api/refresh",{method:"POST"})).json(); if(d.connected) renderDaily(d); else renderGate(); }
       else await loadBoard(); }
  finally{ b.disabled=false; b.textContent="Sync now"; }
}

/* ---------- DAILY ---------- */
async function loadDaily(){
  $("#root").innerHTML='<div class="load">กำลังโหลดงาน…</div>';
  const d=await (await fetch("/api/data")).json();
  if(!d.connected){ renderGate(); return; } renderDaily(d);
}
function dailyCard(t){
  const opts=[0,25,50,75,100].map(v=>`<option value="${v}" ${v===t.percent?"selected":""}>${v}%</option>`).join("");
  if(t.status==="done") return `<div class="card done" style="--c:var(--done)" onclick="openTask('${t.id}')"><div class="ct">${esc(t.title)}</div>
    <div class="cm">${t.plan?esc(t.plan):"—"}${t.completed?` · เสร็จ ${esc(t.completed)}`:""}</div></div>`;
  return `<div class="card" style="--c:${META[t.status].c}" onclick="openTask('${t.id}')"><div class="ct">${esc(t.title)}</div>
    <div class="cm">${t.plan?esc(t.plan):"—"}${t.due?`<span class="due">· due ${esc(t.due)}</span>`:""}</div>
    ${t.percent>0?`<div class="prog"><i style="width:${t.percent}%"></i></div>`:""}
    <div class="cact" onclick="event.stopPropagation()"><select onchange="setPercent('${t.id}',this.value)">${opts}</select>
      <button onclick="setPercent('${t.id}',100)">เสร็จ</button></div></div>`;
}
function renderDaily(d){
  const ai=d.ai, tasks=d.tasks||[]; const gen=d.generated_at?new Date(d.generated_at).toLocaleString("th-TH"):"";
  const by=(k)=>tasks.filter(t=>t.status===k); let h="";
  h+=`<div class="kpis">`;
  for(const k of ["overdue","today","soon","inprogress","done"]) h+=`<div class="kpi" style="--c:${META[k].c}"><div class="n">${by(k).length}</div><div class="l">${META[k].name}</div></div>`;
  h+=`</div>`;
  h+=`<div class="brief"><div class="stamp">อัปเดตล่าสุด · ${esc(gen)}</div>`;
  if(ai){ h+=`<h1>${esc(ai.headline||"สรุปงานวันนี้")}</h1><p>${esc(ai.summary||"")}</p>`;
    if(ai.risks&&ai.risks.length) h+=`<div class="risks">${ai.risks.map(r=>`<span class="risk">${esc(r)}</span>`).join("")}</div>`; }
  else h+=`<h1>สรุปงานวันนี้</h1><p class="hint">เพิ่ม ANTHROPIC_API_KEY ใน Portainer เพื่อเปิดสรุปอัตโนมัติจาก AI ตอนเช้า</p>`;
  h+=`</div>`;
  if(ai&&ai.today_focus&&ai.today_focus.length){
    h+=`<div class="section-row"><span class="section-label">โฟกัสวันนี้</span></div><div class="focus">`;
    ai.today_focus.forEach((f,i)=>{ h+=`<div class="focus-item"><div class="focus-num">${i+1}</div><div class="focus-body">
      <div class="t">${esc(f.title)}${f.plan?`<span class="tag">${esc(f.plan)}</span>`:""}</div><div class="w">${esc(f.why||"")}</div></div></div>`; });
    h+=`</div>`;
  }
  h+=`<div class="section-row"><span class="section-label">งานของฉัน</span></div><div class="board">`;
  for(const k of ORDER){
    let list=by(k); if(k==="done") list=list.slice().sort((a,b)=>(b.completed||"").localeCompare(a.completed||""));
    h+=`<div><div class="col-head"><span class="cdot" style="background:${META[k].c}"></span><span class="name">${META[k].name}</span><span class="count">${list.length}</span></div>`;
    if(!list.length) h+=`<div class="empty">—</div>`;
    else{ const show=k==="done"?list.slice(0,DONE_LIMIT):list; h+=`<div class="stack">${show.map(dailyCard).join("")}`;
      if(k==="done"&&list.length>DONE_LIMIT) h+=`<div class="more">+ อีก ${list.length-DONE_LIMIT} งาน</div>`; h+=`</div>`; }
    h+=`</div>`;
  }
  h+=`</div>`; $("#root").innerHTML=h;
}

/* ---------- BOARD ---------- */
async function loadBoard(){
  $("#root").innerHTML='<div class="load">กำลังโหลด plan…</div>';
  if(!PLANS.length){ const r=await (await fetch("/api/plans")).json(); PLANS=Array.isArray(r)?r:[]; }
  if(!PLANS.length){ $("#root").innerHTML='<div class="empty" style="margin-top:30px">ไม่พบ plan — ลองสร้าง plan ใน Planner ก่อน</div>'; return; }
  const pid=(BOARD&&BOARD.plan_id)||PLANS[0].id;
  const b=await (await fetch("/api/board?plan_id="+encodeURIComponent(pid))).json();
  if(b.error){ $("#root").innerHTML=`<div class="empty" style="margin-top:30px">${esc(b.error)}</div>`; return; }
  BOARD=b; renderBoard();
}
async function changePlan(pid){ const b=await (await fetch("/api/board?plan_id="+encodeURIComponent(pid))).json(); if(!b.error){ BOARD=b; renderBoard(); } }
function boardCard(t){
  const flag=`<span class="flag" style="background:var(--${t.prio})" title="${PRIO[t.prio]}"></span>`;
  const cls=t.status==="done"?"card done":"card";
  return `<div class="${cls}" style="--c:${t.status==="done"?"var(--done)":META[t.status].c}" onclick="openTask('${t.id}')">
    <div class="ct">${esc(t.title)}</div>
    <div class="cm">${flag}${t.due?`<span class="due">${esc(t.due)}</span>`:""}${t.percent>0&&t.percent<100?` · ${t.percent}%`:""}</div>
    ${t.percent>0&&t.percent<100?`<div class="prog"><i style="width:${t.percent}%"></i></div>`:""}</div>`;
}
function renderBoard(){
  const b=BOARD; let h="";
  h+=`<div class="section-row"><span class="plansel"><select onchange="changePlan(this.value)">`;
  h+=PLANS.map(p=>`<option value="${esc(p.id)}" ${p.id===b.plan_id?"selected":""}>${esc(p.title)}</option>`).join("");
  h+=`</select>${b.editable?`<span class="badge edit">● แก้ไขได้</span>`:`<span class="badge ro">อ่านอย่างเดียว</span>`}</span><span class="spacer"></span>`;
  if(b.editable) h+=`<button class="btn-accent" onclick="newTask('')">+ สร้างงาน</button>`;
  h+=`</div>`;
  const buckets=b.buckets.length?b.buckets:[{id:"",name:"งาน"}];
  h+=`<div class="board">`;
  for(const bk of buckets){
    const list=b.tasks.filter(t=>(t.bucketId||"")===bk.id);
    h+=`<div><div class="col-head"><span class="cdot" style="background:var(--accent)"></span><span class="name">${esc(bk.name)}</span><span class="count">${list.length}</span></div>`;
    h+=`<div class="stack">${list.map(boardCard).join("")||'<div class="empty">—</div>'}`;
    if(b.editable) h+=`<button class="addbtn" onclick="newTask('${bk.id}')">+ เพิ่มงาน</button>`;
    h+=`</div></div>`;
  }
  h+=`</div>`; $("#root").innerHTML=h;
}

/* ---------- DRAWER (task detail / create) ---------- */
function closeDrawer(){ $("#scrim").classList.remove("show"); $("#drawer").classList.remove("show"); EDIT=null; }
function showDrawer(html){ $("#drawer").innerHTML=html; $("#scrim").classList.add("show"); $("#drawer").classList.add("show"); }

async function openTask(id){
  showDrawer('<div class="load">กำลังโหลด…</div>');
  const t=await (await fetch("/api/task/"+encodeURIComponent(id))).json();
  if(t.error){ showDrawer(`<div class="ro-note">${esc(t.error)}</div>`); return; }
  EDIT={id:t.id, checklist:t.checklist.map(c=>({...c})), deleted:[], editable:t.editable, bucketId:t.bucketId};
  drawTask(t);
}
function newTask(bucketId){
  if(!BOARD) return;
  EDIT={id:null, checklist:[], deleted:[], editable:true, create:true, bucketId:bucketId||""};
  drawTask({title:"",notes:"",due:"",priority:"medium",percent:0,bucketId:bucketId||"",editable:true,checklist:[]});
}
function drawTask(t){
  const ed=EDIT.editable, dis=ed?"":"disabled";
  const bopts=(BOARD?BOARD.buckets:[]).map(bk=>`<option value="${esc(bk.id)}" ${bk.id===(t.bucketId||"")?"selected":""}>${esc(bk.name)}</option>`).join("");
  const popts=Object.keys(PRIO).map(k=>`<option value="${k}" ${k===(t.priority||"medium")?"selected":""}>${PRIO[k]}</option>`).join("");
  const perc=[0,25,50,75,100].map(v=>`<option value="${v}" ${v===(t.percent||0)?"selected":""}>${v}%</option>`).join("");
  let h=`<div class="dw-head"><textarea id="d-title" ${dis} placeholder="ชื่องาน">${esc(t.title)}</textarea>
    <button class="dw-close" onclick="closeDrawer()">&times;</button></div>`;
  h+=`<div class="dw-label">รายละเอียด</div><textarea class="dw-notes" id="d-notes" ${dis} placeholder="โน้ต / คำอธิบาย">${esc(t.notes||"")}</textarea>`;
  h+=`<div class="dw-label">Checklist</div><div id="d-cl"></div>`;
  if(ed) h+=`<div class="cl-add" onclick="clAdd()"><span style="font-size:16px">+</span> เพิ่มรายการ</div>`;
  h+=`<div class="grid2" style="margin-top:16px">
    <div><label>กำหนดส่ง</label><input type="date" id="d-due" ${dis} value="${esc(t.due||"")}"></div>
    <div><label>Priority</label><select id="d-prio" ${dis}>${popts}</select></div>
    <div><label>Bucket</label><select id="d-bucket" ${dis}>${bopts||'<option value="">(default)</option>'}</select></div>
    <div><label>Progress</label><select id="d-perc" ${dis}>${perc}</select></div></div>`;
  if(!ed) h+=`<div class="ro-note">plan นี้เป็น "อ่านอย่างเดียว" — แก้ไขไม่ได้ (ไม่อยู่ใน whitelist)</div>`;
  h+=`<div class="dw-err" id="d-err"></div>`;
  if(ed) h+=`<div class="dw-actions"><button class="btn-accent" id="d-save" onclick="saveTask()">${EDIT.create?"สร้างงาน":"บันทึก"}</button>
    ${EDIT.create?"":`<button onclick="quickDone()">ปิดงาน</button>`}<button class="btn-ghost" onclick="closeDrawer()">ปิด</button></div>`;
  showDrawer(h); renderCL();
}
function renderCL(){
  const box=$("#d-cl"); if(!box) return; const ed=EDIT.editable;
  box.innerHTML=EDIT.checklist.map((c,i)=>`<div class="cl-item ${c.checked?"checked":""}">
    <button class="chk ${c.checked?"on":""}" ${ed?"":"disabled"} onclick="clToggle(${i})">${c.checked?"&#9745;":"&#9744;"}</button>
    <input value="${esc(c.title)}" ${ed?"":"disabled"} oninput="clEdit(${i},this.value)" placeholder="รายการ">
    ${ed?`<button class="del" onclick="clDel(${i})">&times;</button>`:""}</div>`).join("")
    || '<div style="font-size:12.5px;color:var(--faint);padding:4px 0">— ไม่มีรายการ —</div>';
}
function clAdd(){ EDIT.checklist.push({title:"",checked:false}); renderCL(); }
function clToggle(i){ EDIT.checklist[i].checked=!EDIT.checklist[i].checked; renderCL(); }
function clEdit(i,v){ EDIT.checklist[i].title=v; }
function clDel(i){ const c=EDIT.checklist[i]; if(c.id) EDIT.deleted.push(c.id); EDIT.checklist.splice(i,1); renderCL(); }

async function saveTask(){
  const err=$("#d-err"), btn=$("#d-save"); err.textContent="";
  const title=$("#d-title").value.trim();
  if(!title){ err.textContent="ใส่ชื่องานก่อน"; return; }
  btn.disabled=true; btn.textContent="กำลังบันทึก…";
  const cl=EDIT.checklist.filter(c=>c.title.trim()).map(c=>({id:c.id,title:c.title.trim(),checked:c.checked}));
  const common={title, notes:$("#d-notes").value, due:$("#d-due").value,
    priority:$("#d-prio").value, percent:Number($("#d-perc").value), bucket_id:$("#d-bucket").value};
  let res;
  if(EDIT.create){
    res=await fetch("/api/tasks",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({...common, plan_id:BOARD.plan_id, assign_me:true})});
    // checklist/notes ใส่รอบสองหลังได้ id
    const j=await res.json();
    if(res.ok && (cl.length || common.notes)){ await fetch("/api/task/"+encodeURIComponent(j.id),{method:"PATCH",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({notes:common.notes,checklist:cl})}); }
    if(!res.ok){ err.textContent=j.error||"สร้างไม่สำเร็จ"; btn.disabled=false; btn.textContent="สร้างงาน"; return; }
  }else{
    res=await fetch("/api/task/"+encodeURIComponent(EDIT.id),{method:"PATCH",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({...common, checklist:cl, checklist_deleted:EDIT.deleted})});
    const j=await res.json();
    if(!res.ok){ err.textContent=j.error||"บันทึกไม่สำเร็จ"; btn.disabled=false; btn.textContent="บันทึก"; return; }
  }
  closeDrawer(); TAB==="board"?loadBoard():loadDaily();
}
async function quickDone(){
  const res=await fetch("/api/task/"+encodeURIComponent(EDIT.id),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({percent:100})});
  const j=await res.json(); if(!res.ok){ $("#d-err").textContent=j.error||"ปิดงานไม่สำเร็จ"; return; }
  closeDrawer(); TAB==="board"?loadBoard():loadDaily();
}
async function setPercent(id,val){
  const res=await fetch("/api/task/"+encodeURIComponent(id),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({percent:Number(val)})});
  const j=await res.json(); if(!res.ok){ alert(j.error||"อัปเดตไม่สำเร็จ"); return; } loadDaily();
}

/* ---------- GATE ---------- */
function renderGate(){
  $("#root").innerHTML=`<div class="gate"><div class="glyph">M</div><h2>เชื่อมต่อ Microsoft Planner</h2>
    <p>กด Connect แล้วเอารหัสไปกรอกที่หน้า Microsoft เพื่อเชื่อมบัญชีครั้งเดียว จากนั้นระบบจะดึงงานและอัปเดตให้เองทุกเช้า</p>
    <button class="btn-accent" onclick="connect()">Connect</button><div id="gateout" style="margin-top:16px"></div></div>`;
}
async function connect(){
  const out=$("#gateout"); out.innerHTML="กำลังขอรหัส…";
  const r=await (await fetch("/auth/start",{method:"POST"})).json();
  if(r.error){ out.innerHTML=`<span style="color:var(--overdue)">${esc(r.error)}</span>`; return; }
  out.innerHTML=`<div class="code">${esc(r.user_code)}</div><div style="color:var(--muted);font-size:13px">กรอกรหัสนี้ที่ <a href="${esc(r.verification_uri)}" target="_blank">${esc(r.verification_uri)}</a></div>`;
  const iv=setInterval(async()=>{ const st=await (await fetch("/api/status")).json();
    if(st.connected){ clearInterval(iv); $("#dot").className="dot on"; $("#statustxt").textContent=st.schedule; switchTab(TAB); } },4000);
}

document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDrawer(); });
$("#date")&&($("#date").textContent=fmtDate());
boot();
</script>
</body>
</html>
