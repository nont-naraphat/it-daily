<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT Daily</title>
<style>
  :root{
    --bg:#0d1017; --surface:#141922; --surface2:#1a202b; --raise:#202836; --line:#242c39; --line2:#2f3947;
    --text:#eaeef4; --muted:#9aa5b4; --faint:#5f6b7c;
    --accent:#5b8dff; --accent-soft:#1e2b47;
    --overdue:#f0524f; --today:#e8973a; --soon:#5b8dff; --inprogress:#8a94a6; --backlog:#5f6b7c; --done:#3fae74;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;
    --r:10px; --r-sm:7px;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f5f7fa; --surface:#ffffff; --surface2:#f7f9fc; --raise:#eef2f7; --line:#e4e9f0; --line2:#d5dce6;
      --text:#131824; --muted:#5a6575; --faint:#98a2b2; --accent-soft:#e8effe; }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;
    -webkit-font-smoothing:antialiased;padding:0 22px 72px}
  .wrap{max-width:1180px;margin:0 auto}
  ::selection{background:var(--accent-soft)}

  /* Header */
  header{display:flex;align-items:center;gap:16px;padding:20px 0;flex-wrap:wrap}
  .brand{font-family:var(--mono);font-weight:600;letter-spacing:.24em;font-size:14px;color:var(--text)}
  .brand b{color:var(--accent);font-weight:600}
  .date{font-family:var(--mono);font-size:12.5px;color:var(--muted);padding-left:14px;margin-left:2px;border-left:1px solid var(--line2)}
  .spacer{flex:1}
  .status{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);
    background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
  .dot.on{background:var(--done);box-shadow:0 0 0 3px color-mix(in srgb,var(--done) 20%,transparent)}
  .dot.off{background:var(--overdue);box-shadow:0 0 0 3px color-mix(in srgb,var(--overdue) 20%,transparent)}
  button{font-family:var(--sans);font-size:13px;color:var(--text);background:var(--surface2);
    border:1px solid var(--line2);border-radius:var(--r-sm);padding:8px 15px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button:disabled{opacity:.5;cursor:default}
  .btn-accent{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
  .btn-accent:hover{background:color-mix(in srgb,var(--accent) 88%,#000);color:#fff}
  input,select{font-family:var(--sans);font-size:13px;color:var(--text);background:var(--bg);
    border:1px solid var(--line2);border-radius:var(--r-sm);padding:8px 10px}
  input:focus,select:focus{outline:none;border-color:var(--accent)}

  /* KPI strip */
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:6px 0 20px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
  .kpi .n{font-family:var(--mono);font-size:24px;font-weight:600;line-height:1;color:var(--text)}
  .kpi .l{font-size:11.5px;color:var(--muted);margin-top:5px}
  @media (max-width:720px){ .kpis{grid-template-columns:repeat(3,1fr)} }

  /* AI brief */
  .brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:20px 22px;margin-bottom:8px;position:relative}
  .brief::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:3px;background:var(--accent)}
  .brief .stamp{font-family:var(--mono);font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.15em}
  .brief h1{font-size:19px;font-weight:600;margin:9px 0 6px;line-height:1.4}
  .brief p{margin:0;color:var(--muted);font-size:14px}
  .brief .hint{color:var(--faint);font-size:13px;font-style:normal}
  .risks{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
  .risk{font-size:12px;color:var(--overdue);background:color-mix(in srgb,var(--overdue) 11%,transparent);
    border:1px solid color-mix(in srgb,var(--overdue) 28%,transparent);border-radius:6px;padding:3px 10px}

  /* Section */
  .section-row{display:flex;align-items:center;margin:28px 0 14px}
  .section-label{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .section-row button{margin-left:auto;padding:7px 13px}

  /* Today focus */
  .focus{display:grid;gap:9px}
  .focus-item{display:flex;gap:15px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 17px;transition:.15s}
  .focus-item:hover{border-color:var(--line2)}
  .focus-num{font-family:var(--mono);font-size:14px;color:var(--accent);min-width:20px;padding-top:1px}
  .focus-body .t{font-weight:500;font-size:14.5px}
  .focus-body .w{font-size:13px;color:var(--muted);margin-top:1px}
  .tag{font-family:var(--mono);font-size:10.5px;color:var(--muted);background:var(--raise);
    border-radius:5px;padding:2px 7px;margin-left:8px;vertical-align:1px}

  /* Create form */
  .create{background:var(--surface);border:1px solid var(--accent);border-radius:var(--r);padding:18px;margin-bottom:16px;
    display:grid;gap:12px;grid-template-columns:1fr 1fr}
  .create .full{grid-column:1/-1}
  .create label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:5px;font-weight:500}
  .create input,.create select{width:100%}
  .create .actions{grid-column:1/-1;display:flex;align-items:center;gap:12px;margin-top:2px}
  .create .chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
  .create .chk input{width:auto}
  .create .err{grid-column:1/-1;color:var(--overdue);font-size:12.5px;min-height:0}
  @media (max-width:560px){ .create{grid-template-columns:1fr} }

  /* Board */
  .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px;align-items:start}
  .col{background:transparent}
  .col-head{display:flex;align-items:center;gap:8px;padding:0 2px 11px;margin-bottom:2px;border-bottom:1px solid var(--line)}
  .col-head .cdot{width:8px;height:8px;border-radius:3px;flex:none}
  .col-head .name{font-size:12.5px;font-weight:600;letter-spacing:.01em}
  .col-head .count{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto;
    background:var(--raise);border-radius:999px;padding:1px 8px;min-width:22px;text-align:center}
  .stack{display:grid;gap:9px;margin-top:11px}

  .card{border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;background:var(--surface);
    border-left:3px solid var(--c);transition:.15s}
  .card:hover{border-color:var(--line2);border-left-color:var(--c)}
  .card .ct{font-size:13.5px;font-weight:500;line-height:1.4}
  .card .cm{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:7px;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
  .card .cm .due{color:var(--muted)}
  .prog{height:4px;border-radius:3px;background:var(--raise);margin-top:9px;overflow:hidden}
  .prog>i{display:block;height:100%;background:var(--c);border-radius:3px;transition:width .3s}
  .cact{display:flex;align-items:center;gap:7px;margin-top:10px}
  .cact select{padding:4px 7px;font-size:11px;border-radius:6px}
  .cact button{padding:4px 11px;font-size:11px;border-radius:6px}
  .card.done{opacity:.62;border-left-color:var(--done)}
  .card.done .ct{text-decoration:line-through;text-decoration-color:var(--faint);text-decoration-thickness:1px}
  .card.done .ct::before{content:"\2713  ";color:var(--done);font-weight:600;text-decoration:none}
  .more{font-size:11.5px;color:var(--faint);text-align:center;padding:8px 0 2px}
  .empty{font-size:12px;color:var(--faint);padding:14px 2px;text-align:center;border:1px dashed var(--line);border-radius:var(--r);margin-top:11px}

  /* Gate */
  .gate{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:40px 28px;margin:40px auto;max-width:520px;text-align:center}
  .gate .glyph{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-family:var(--mono);font-size:20px;font-weight:600}
  .gate h2{font-size:18px;margin:0 0 8px}
  .gate p{color:var(--muted);font-size:14px;margin:0 auto 20px;max-width:400px}
  .code{font-family:var(--mono);font-size:28px;letter-spacing:.3em;background:var(--raise);
    border:1px dashed var(--accent);border-radius:12px;padding:16px 22px;display:inline-block;margin:8px 0 6px;color:var(--text)}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .load{color:var(--muted);text-align:center;padding:48px 0;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand">IT<b>·</b>DAILY</span>
    <span class="date" id="date"></span>
    <span class="spacer"></span>
    <span class="status"><span class="dot" id="dot"></span><span id="statustxt">กำลังเชื่อมต่อ…</span></span>
    <button class="btn-accent" id="sync" onclick="sync()">Sync now</button>
  </header>
  <div id="root"><div class="load">กำลังโหลด…</div></div>
</div>

<script>
const $=(s)=>document.querySelector(s);
const ORDER=["overdue","today","soon","inprogress","backlog","done"];
const META={
  overdue:{name:"เลยกำหนด",c:"var(--overdue)"},
  today:{name:"วันนี้",c:"var(--today)"},
  soon:{name:"ใกล้ถึง",c:"var(--soon)"},
  inprogress:{name:"กำลังทำ",c:"var(--inprogress)"},
  backlog:{name:"รอเริ่ม",c:"var(--backlog)"},
  done:{name:"เสร็จแล้ว",c:"var(--done)"},
};
const DONE_LIMIT=8;
const esc=(s)=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let PLANS=[];

function fmtDate(){ $("#date").textContent=new Date().toLocaleDateString("th-TH",{weekday:"long",day:"numeric",month:"long",year:"numeric"}); }

async function boot(){
  fmtDate();
  const st=await (await fetch("/api/status")).json();
  if(!st.config_ok){ $("#dot").className="dot off"; $("#statustxt").textContent="ยังไม่ได้ตั้งค่า .env"; $("#root").innerHTML=""; return; }
  if(!st.connected){ $("#dot").className="dot off"; $("#statustxt").textContent="ยังไม่ได้เชื่อม Microsoft"; renderGate(); return; }
  $("#dot").className="dot on"; $("#statustxt").textContent=st.schedule;
  loadData();
}
async function loadData(){
  $("#root").innerHTML='<div class="load">กำลังโหลดงาน…</div>';
  const d=await (await fetch("/api/data")).json();
  if(!d.connected){ renderGate(); return; }
  render(d);
}
async function sync(){
  const b=$("#sync"); b.disabled=true; b.textContent="กำลัง sync…";
  try{ const d=await (await fetch("/api/refresh",{method:"POST"})).json();
    if(d.connected) render(d); else renderGate(); }
  finally{ b.disabled=false; b.textContent="Sync now"; }
}

function card(t){
  const opts=[0,25,50,75,100].map(v=>`<option value="${v}" ${v===t.percent?"selected":""}>${v}%</option>`).join("");
  if(t.status==="done"){
    return `<div class="card done" style="--c:var(--done)"><div class="ct">${esc(t.title)}</div>
      <div class="cm">${t.plan?esc(t.plan):"—"}${t.completed?` · เสร็จ ${esc(t.completed)}`:""}</div></div>`;
  }
  return `<div class="card" style="--c:${META[t.status].c}"><div class="ct">${esc(t.title)}</div>
    <div class="cm">${t.plan?esc(t.plan):"—"}${t.due?`<span class="due">· due ${esc(t.due)}</span>`:""}</div>
    ${t.percent>0?`<div class="prog"><i style="width:${t.percent}%"></i></div>`:""}
    <div class="cact"><select onchange="setPercent('${t.id}',this.value)">${opts}</select>
      <button onclick="setPercent('${t.id}',100)">เสร็จ</button></div></div>`;
}

function render(d){
  const ai=d.ai, tasks=d.tasks||[];
  const gen=d.generated_at?new Date(d.generated_at).toLocaleString("th-TH"):"";
  const by=(k)=>tasks.filter(t=>t.status===k);
  let h="";

  // KPI strip
  h+=`<div class="kpis">`;
  for(const k of ["overdue","today","soon","inprogress","done"]){
    h+=`<div class="kpi" style="--c:${META[k].c}"><div class="n">${by(k).length}</div><div class="l">${META[k].name}</div></div>`;
  }
  h+=`</div>`;

  // AI brief
  h+=`<div class="brief"><div class="stamp">อัปเดตล่าสุด · ${esc(gen)}</div>`;
  if(ai){
    h+=`<h1>${esc(ai.headline||"สรุปงานวันนี้")}</h1><p>${esc(ai.summary||"")}</p>`;
    if(ai.risks&&ai.risks.length) h+=`<div class="risks">${ai.risks.map(r=>`<span class="risk">${esc(r)}</span>`).join("")}</div>`;
  }else{
    h+=`<h1>สรุปงานวันนี้</h1><p class="hint">เพิ่ม ANTHROPIC_API_KEY ใน Portainer เพื่อเปิดสรุปอัตโนมัติจาก AI ตอนเช้า</p>`;
  }
  h+=`</div>`;

  // Today focus
  if(ai&&ai.today_focus&&ai.today_focus.length){
    h+=`<div class="section-row"><span class="section-label">โฟกัสวันนี้</span></div><div class="focus">`;
    ai.today_focus.forEach((f,i)=>{ h+=`<div class="focus-item"><div class="focus-num">${i+1}</div><div class="focus-body">
      <div class="t">${esc(f.title)}${f.plan?`<span class="tag">${esc(f.plan)}</span>`:""}</div>
      <div class="w">${esc(f.why||"")}</div></div></div>`; });
    h+=`</div>`;
  }

  // Board
  h+=`<div class="section-row"><span class="section-label">งานทั้งหมด</span>
    <button onclick="toggleCreate()">+ สร้างงานใหม่</button></div><div id="createbox"></div>`;
  h+=`<div class="board">`;
  for(const k of ORDER){
    let list=by(k);
    if(k==="done") list=list.slice().sort((a,b)=>(b.completed||"").localeCompare(a.completed||""));
    h+=`<div class="col"><div class="col-head"><span class="cdot" style="background:${META[k].c}"></span>
      <span class="name">${META[k].name}</span><span class="count">${list.length}</span></div>`;
    if(!list.length){ h+=`<div class="empty">—</div>`; }
    else{
      const show=k==="done"?list.slice(0,DONE_LIMIT):list;
      h+=`<div class="stack">${show.map(card).join("")}`;
      if(k==="done"&&list.length>DONE_LIMIT) h+=`<div class="more">+ อีก ${list.length-DONE_LIMIT} งาน</div>`;
      h+=`</div>`;
    }
    h+=`</div>`;
  }
  h+=`</div>`;
  $("#root").innerHTML=h;
}

async function toggleCreate(){
  const box=$("#createbox");
  if(box.innerHTML){ box.innerHTML=""; return; }
  if(!PLANS.length){ const r=await (await fetch("/api/plans")).json(); PLANS=Array.isArray(r)?r:[]; }
  box.innerHTML=`<div class="create">
    <div class="full"><label>ชื่องาน</label><input id="c-title" placeholder="เช่น ตรวจ EDR policy Phase 1"></div>
    <div><label>Plan</label><select id="c-plan" onchange="loadBuckets()">
      <option value="">— เลือก plan —</option>${PLANS.map(p=>`<option value="${esc(p.id)}">${esc(p.title)}</option>`).join("")}</select></div>
    <div><label>Bucket</label><select id="c-bucket"><option value="">(default)</option></select></div>
    <div><label>กำหนดส่ง</label><input type="date" id="c-due"></div>
    <div class="chk"><input type="checkbox" id="c-me" checked><label style="margin:0">assign ให้ฉัน</label></div>
    <div class="err" id="c-err"></div>
    <div class="actions"><button class="btn-accent" id="c-btn" onclick="createTask()">สร้างงาน</button>
      <button onclick="toggleCreate()">ยกเลิก</button></div></div>`;
}
async function loadBuckets(){
  const pid=$("#c-plan").value, sel=$("#c-bucket");
  sel.innerHTML='<option value="">(default)</option>';
  if(!pid) return;
  const r=await (await fetch("/api/buckets?plan_id="+encodeURIComponent(pid))).json();
  if(Array.isArray(r)) r.forEach(b=>{ const o=document.createElement("option"); o.value=b.id; o.textContent=b.name; sel.appendChild(o); });
}
async function createTask(){
  const err=$("#c-err"), btn=$("#c-btn");
  const body={title:$("#c-title").value.trim(),plan_id:$("#c-plan").value,bucket_id:$("#c-bucket").value,due:$("#c-due").value,assign_me:$("#c-me").checked};
  if(!body.title||!body.plan_id){ err.textContent="ใส่ชื่องานและเลือก plan ก่อน"; return; }
  err.textContent=""; btn.disabled=true; btn.textContent="กำลังสร้าง…";
  const res=await fetch("/api/tasks",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await res.json(); btn.disabled=false; btn.textContent="สร้างงาน";
  if(!res.ok){ err.textContent=j.error||"สร้างไม่สำเร็จ"; return; }
  await sync();
}
async function setPercent(id,val){
  const res=await fetch("/api/tasks/"+encodeURIComponent(id),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({percent:Number(val)})});
  const j=await res.json();
  if(!res.ok){ alert(j.error||"อัปเดตไม่สำเร็จ"); return; }
  await sync();
}

function renderGate(){
  $("#root").innerHTML=`<div class="gate"><div class="glyph">M</div>
    <h2>เชื่อมต่อ Microsoft Planner</h2>
    <p>กด Connect แล้วเอารหัสไปกรอกที่หน้า Microsoft เพื่อเชื่อมบัญชีครั้งเดียว จากนั้นระบบจะดึงงานและอัปเดตให้เองทุกเช้า</p>
    <button class="btn-accent" onclick="connect()">Connect</button>
    <div id="gateout" style="margin-top:16px"></div></div>`;
}
async function connect(){
  const out=$("#gateout"); out.innerHTML="กำลังขอรหัส…";
  const r=await (await fetch("/auth/start",{method:"POST"})).json();
  if(r.error){ out.innerHTML=`<span style="color:var(--overdue)">${esc(r.error)}</span>`; return; }
  out.innerHTML=`<div class="code">${esc(r.user_code)}</div>
    <div style="color:var(--muted);font-size:13px">กรอกรหัสนี้ที่ <a href="${esc(r.verification_uri)}" target="_blank">${esc(r.verification_uri)}</a></div>`;
  poll();
}
function poll(){
  const iv=setInterval(async()=>{ const st=await (await fetch("/api/status")).json();
    if(st.connected){ clearInterval(iv); $("#dot").className="dot on"; $("#statustxt").textContent=st.schedule; loadData(); } },4000);
}
boot();
</script>
</body>
</html>
